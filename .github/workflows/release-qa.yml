name: Update the single PLAY80 APK (permanent signing required)

# Publish PLAY80 to the existing release after installation and upgrade checks.
# Abort without publishing when the permanent signing key is unavailable.
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/release-qa.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/release-qa.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Replace the V5.2 APK after all checks pass'
        required: true
        type: boolean
        default: false

concurrency:
  group: play80-stable-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PLAY80_SIGNER_SHA256: 'f12ff7399065778b45539ac30d319a85c413472e992b9157414b84e71ea57dd2'
  OWNER_BACKUP_SHA256: '239e24f73d777b851d2a8c1891a91c5576afad7163bb85c6bcf02121de0174cc'
  LEGACY_QA_APK_SHA256: '9a83dc140d5f4d41dddd79f3112312b548e3373d837ecd3bedec41a70c7d56a4'

jobs:
  qa-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm verified source and run unit checks
        shell: bash
        run: |
          set -euo pipefail
          for path in assets/index.html assets/play80_online.js assets/play80_tournament.js assets/play80_practice_2048.js build_qa.py tests/test_2048.js; do
            test -s "$path" || { echo "::error::Missing $path"; exit 1; }
          done
          node --check assets/play80_practice_2048.js
          node --check assets/play80_online.js
          node --check assets/play80_tournament.js
          node --experimental-strip-types tests/test_dsr_creation.mjs
          node tests/test_2048.js
          node --check assets/play80_chess.js
          node --check assets/play80_bet_arena.js
          node tests/test_chess.js
          node tests/test_v44_ui.js
          node --check assets/play80_rules_gate.js
          node tests/test_rules_gate.js
          node --check assets/play80_tournament_menu.js
          node tests/test_v46_ui.js
          test -s tests/test_v50_roles_browser.py
          node --check assets/play80_bubble_deluxe.js
          python -m compileall -q build_qa.py release_check.py
      - name: Verify rewards and support on an isolated database
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f play80-db-test >/dev/null 2>&1 || true' EXIT
          docker run --detach --name play80-db-test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          for attempt in {1..30}; do
            docker exec play80-db-test pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker cp supabase/migrations/20261126193000_rewards_referrals_owner_support.sql play80-db-test:/tmp/play80-reward-migration.sql
          docker exec -i play80-db-test psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 < tests/play80_rewards_support.sql
      - name: Run account and signup browser tests
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/test_v50_roles_browser.py
          python tests/test_v51_signup_feedback.py
          python tests/test_account_recovery.py
      - name: Fetch the currently distributed APK and derive the next version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download qa-v5.2-unified-login-20261125 --pattern PLAY80_V5_2_GitHub_QA.apk --dir "$RUNNER_TEMP/baseline"
          old="$RUNNER_TEMP/baseline/PLAY80_V5_2_GitHub_QA.apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          info="$("$tools/aapt" dump badging "$old")"
          code="$(sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" <<< "$info")"
          [[ "$code" =~ ^[0-9]+$ ]]
          echo "PLAY80_VERSION_CODE=$((code + 1))" >> "$GITHUB_ENV"
      - name: Verify permanent key against the release, then build and sign
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.PLAY80_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY80_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::No permanent signing key configured. Refusing to build a differently-signed APK."
            exit 1
          fi
          umask 077
          export PLAY80_SIGNING_KEYSTORE="$RUNNER_TEMP/play80-permanent.jks"
          trap 'rm -f -- "$PLAY80_SIGNING_KEYSTORE"' EXIT
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$PLAY80_SIGNING_KEYSTORE"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15052399710/zip" > "$RUNNER_TEMP/owner.zip"
            echo "$OWNER_BACKUP_SHA256  $RUNNER_TEMP/owner.zip" | sha256sum -c -
            unzip -p "$RUNNER_TEMP/owner.zip" PLAY80-permanent.p12 > "$PLAY80_SIGNING_KEYSTORE"
          fi
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          baseline="$RUNNER_TEMP/baseline/PLAY80_V5_2_GitHub_QA.apk"
          candidate="$(keytool -exportcert -alias play80 -storetype PKCS12 -keystore "$PLAY80_SIGNING_KEYSTORE" -storepass:env KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          [[ "$candidate" == "$PLAY80_SIGNER_SHA256" ]] || { echo "::error::Unexpected signing certificate"; exit 1; }
          if [[ "$(sha256sum "$baseline" | cut -d' ' -f1)" == "$LEGACY_QA_APK_SHA256" ]]; then
            # The approved disposable QA build requires one clean installation.
            # Build a lower-version fixture to exercise future in-place updates.
            PLAY80_VERSION_CODE="$((PLAY80_VERSION_CODE - 1))" PLAY80_SIGNING_PASSWORD="$KEYSTORE_PASSWORD" python build_qa.py
            cp ../PLAY80_V4_1_Practice_QA.apk "$RUNNER_TEMP/update-base.apk"
          else
            cp "$baseline" "$RUNNER_TEMP/update-base.apk"
          fi
          PLAY80_SIGNING_PASSWORD="$KEYSTORE_PASSWORD" python build_qa.py
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/aapt" dump badging ../PLAY80_V4_1_Practice_QA.apk
          "$TOOLS/zipalign" -c 4 ../PLAY80_V4_1_Practice_QA.apk
          unzip -p ../PLAY80_V4_1_Practice_QA.apk assets/index.html > "$RUNNER_TEMP/play80-opened-apk.html"
          grep -Fq "id=\"p8BuildLabel\">বিল্ড $PLAY80_VERSION_CODE<" "$RUNNER_TEMP/play80-opened-apk.html"
          grep -Fq 'id="p8MenuAvatar"' "$RUNNER_TEMP/play80-opened-apk.html"
          grep -Fq 'id="p8MenuQuick"' "$RUNNER_TEMP/play80-opened-apk.html"
          unzip -p ../PLAY80_V4_1_Practice_QA.apk assets/play80_online.js > "$RUNNER_TEMP/play80-opened-account.js"
          grep -Fq "?'@'+profile.username:" "$RUNNER_TEMP/play80-opened-account.js"
          grep -Fq 'id="play80DemoReferenceField"' "$RUNNER_TEMP/play80-opened-apk.html"
          grep -Fq 'p8FirstCreditOffer' "$RUNNER_TEMP/play80-opened-account.js"
          grep -Fq 'id="headerCoins"' "$RUNNER_TEMP/play80-opened-apk.html"
          if grep -Fq 'id="headerPoints"' "$RUNNER_TEMP/play80-opened-apk.html"; then exit 1; fi
          grep -Fq 'data-p8-footer="wallet"' "$RUNNER_TEMP/play80-opened-apk.html"
          grep -Fq 'function syncFooter()' "$RUNNER_TEMP/play80-opened-account.js"
          echo "Verified menu and server coin header inside APK build $PLAY80_VERSION_CODE"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 28 ../PLAY80_V4_1_Practice_QA.apk
          mkdir -p dist
          cp ../PLAY80_V4_1_Practice_QA.apk dist/PLAY80_V5_2_GitHub_QA.apk
          sha256sum dist/PLAY80_V5_2_GitHub_QA.apk
      - name: Verify signing identity against the released APK
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fingerprint() {
            "$tools/apksigner" verify --min-sdk-version 28 --print-certs-pem "$1" > "$RUNNER_TEMP/signer.txt"
            test "$(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/signer.txt")" = 1
            openssl x509 -in "$RUNNER_TEMP/signer.txt" -outform DER | sha256sum | cut -d' ' -f1
          }
          old="$(fingerprint "$RUNNER_TEMP/update-base.apk")"
          new="$(fingerprint dist/PLAY80_V5_2_GitHub_QA.apk)"
          [[ "$old" == "$PLAY80_SIGNER_SHA256" && "$new" == "$PLAY80_SIGNER_SHA256" ]]
      - name: Make disk space for the Android system image
        run: |
          # Disposable GitHub-hosted runner toolchains that this Android job never uses.
          sudo rm -rf -- /usr/share/dotnet /opt/ghc
          df -h "$RUNNER_TEMP"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the signed APK on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 480
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          profile: pixel_5
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash tests/android_release_update.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ !(inputs.publish || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-tested-play80]'))) }}
        with:
          name: PLAY80-V5.2-QA
          path: dist/PLAY80_V5_2_GitHub_QA.apk
          retention-days: 14
      - name: Update the same existing V5.2 Release asset without creating another version
        if: inputs.publish || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-tested-play80]'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=qa-v5.2-unified-login-20261125
          gh release view "$TAG" >/dev/null || { echo "::error::Protected latest release missing"; exit 1; }
          gh release upload "$TAG" dist/PLAY80_V5_2_GitHub_QA.apk --clobber
          gh release edit "$TAG" --title "PLAY80 Latest QA (one stable download link)"
          echo "Updated the only latest APK asset: $TAG"
