name: PLAY80 source checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/play80-create-dsr/**'
      - 'tests/**'
      - 'build_qa.py'
      - 'release_check.py'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/play80-create-dsr/**'
      - 'tests/**'
      - 'build_qa.py'
      - 'release_check.py'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full source is checked in
        run: |
          set -euo pipefail
          for file in build_qa.py assets/index.html assets/play80_online.js assets/play80_tournament.js assets/play80_practice_2048.js tests/test_2048.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Source import incomplete. Refusing to claim a valid build."
              exit 1
            fi
          done
      - name: Python syntax verification
        run: python -m compileall -q build_qa.py release_check.py
      - name: JavaScript syntax verification
        run: |
          node --check assets/play80_online.js
          node --check assets/play80_tournament.js
          node --check assets/play80_practice_2048.js
          node --check assets/play80_chess.js
          node --check assets/play80_bet_arena.js
          node --check assets/play80_rules_gate.js
          node --check assets/play80_tournament_menu.js
      - name: Unit and UI asset tests
        run: |
          node --experimental-strip-types tests/test_dsr_creation.mjs
          node tests/test_2048.js
          node tests/test_chess.js
          node tests/test_v44_ui.js
          node tests/test_rules_gate.js
          node tests/test_v46_ui.js
      - name: Verify daily claim queue on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f play80-daily-test >/dev/null 2>&1 || true' EXIT
          docker run --detach --name play80-daily-test -e POSTGRES_HOST_AUTH_METHOD=trust -v "$PWD:/work:ro" postgres:16
          for attempt in {1..30}; do
            docker exec play80-daily-test pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec -i play80-daily-test psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f /work/tests/play80_daily_claim.sql
      - name: Scan committed files for signing secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          banned={'.keystore','.jks','.p12','.pfx','.pem','.key'}
          files=[str(f) for f in Path('.').rglob('*') if f.is_file() and '.git' not in f.parts and f.suffix.lower() in banned]
          if files:
              raise SystemExit('Signing or secret files may not be committed: '+str(files))
          print('No signing key file extensions committed')
          PY
