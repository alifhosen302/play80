name: PLAY80 source checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/play80-create-dsr/**'
      - 'tests/**'
      - 'build_qa.py'
      - 'release_check.py'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/play80-create-dsr/**'
      - 'tests/**'
      - 'build_qa.py'
      - 'release_check.py'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and unit checks
        run: bash scripts/verify.sh source
      - name: Isolated database regression checks
        run: bash scripts/verify.sh database
