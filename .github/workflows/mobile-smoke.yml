name: PLAY80 real mobile-browser smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - 'tests/test_account_recovery.py'
      - 'tests/test_v47_mobile_browser.py'
      - 'tests/test_v50_roles_browser.py'
      - 'tests/test_v51_signup_feedback.py'
      - '.github/workflows/mobile-smoke.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'tests/test_account_recovery.py'
      - 'tests/test_v46_mobile_browser.py'
      - '.github/workflows/mobile-smoke.yml'
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Use pinned Playwright browser from Ubuntu 24.04 container
        run: python -m pip install playwright==1.56.0
      - name: Run Android-sized UI/navigation/checkmate tests
        run: |
          python tests/test_v47_mobile_browser.py
          python tests/test_v50_roles_browser.py
          python tests/test_v51_signup_feedback.py
          python tests/test_account_recovery.py
